on:
  push:
    branches-ignore:
      - main
      - ghpages

name: "check package"

jobs:
  check-package:
    runs-on: ubuntu-latest
    name: "check package"
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: inbo/actions/check_pkg@1cb9c04524e14ecbfabbd1303470b75d47dd2de2 # v2
