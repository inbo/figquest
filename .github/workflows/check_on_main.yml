on:
  push:
    branches:
      - main
  schedule:
    - cron: '6 0 15 * *'

name: "check package on main"

jobs:
  check-package:
    runs-on: ubuntu-latest
    name: "check package"
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: write
      pages: write
    steps:
      - uses: inbo/actions/check_pkg@1cb9c04524e14ecbfabbd1303470b75d47dd2de2 # v2
